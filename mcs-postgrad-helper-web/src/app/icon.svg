<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="计算机考研助手 Logo">
  <defs>
    <linearGradient id="capNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4f9c" />
      <stop offset="100%" stop-color="#0b2a5b" />
    </linearGradient>
    <linearGradient id="screenNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123f7d" />
      <stop offset="100%" stop-color="#071e44" />
    </linearGradient>
    <linearGradient id="baseBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fc4f7" />
      <stop offset="50%" stop-color="#cfe8ff" />
      <stop offset="100%" stop-color="#6ea9e8" />
    </linearGradient>
    <linearGradient id="swooshBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f9df2" />
      <stop offset="100%" stop-color="#8bc8ff" />
    </linearGradient>
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bookPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bookTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b2a5b" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 蓝色环绕弧线 -->
  <path d="M64 392 C152 486 374 474 452 286" fill="none" stroke="url(#swooshBlue)" stroke-width="20" stroke-linecap="round" opacity="0.75" />
  <path d="M96 430 C208 484 372 438 430 330" fill="none" stroke="#b9dcff" stroke-width="8" stroke-linecap="round" opacity="0.55" />

  <!-- 右侧四本 408 教材 -->
  <g filter="url(#softShadow)">
    <g>
      <rect x="350" y="220" width="150" height="48" rx="13" fill="url(#bookBlue)" />
      <path d="M482 230 q18 14 0 28" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linecap="round" />
      <text x="364" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#ffffff">数据结构</text>
    </g>
    <g>
      <rect x="350" y="276" width="150" height="48" rx="13" fill="url(#bookPurple)" />
      <path d="M482 286 q18 14 0 28" fill="none" stroke="#ede9fe" stroke-width="5" stroke-linecap="round" />
      <text x="364" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#ffffff">计算机组成</text>
    </g>
    <g>
      <rect x="350" y="332" width="150" height="48" rx="13" fill="url(#bookTeal)" />
      <path d="M482 342 q18 14 0 28" fill="none" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round" />
      <text x="364" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#ffffff">操作系统</text>
    </g>
    <g>
      <rect x="350" y="388" width="150" height="48" rx="13" fill="url(#bookBlue)" />
      <path d="M482 398 q18 14 0 28" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linecap="round" />
      <text x="364" y="418" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#ffffff">计算机网络</text>
    </g>
  </g>

  <!-- 笔记本电脑 -->
  <g filter="url(#softShadow)">
    <rect x="62" y="176" width="278" height="206" rx="22" fill="url(#screenNavy)" stroke="#7fb8ef" stroke-width="9" />
    <rect x="80" y="194" width="242" height="168" rx="12" fill="#0a3168" />
    <text x="201" y="314" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="800" fill="#ffffff">&lt;/&gt;</text>
    <path d="M40 384 h322 l-22 30 H62 Z" fill="url(#baseBlue)" />
    <path d="M168 384 h66 l-8 10 h-50 Z" fill="#dceeff" opacity="0.9" />
  </g>

  <!-- 学士帽 -->
  <g filter="url(#softShadow)">
    <path d="M216 58 L342 116 L216 174 L90 116 Z" fill="url(#capNavy)" stroke="#3b74c9" stroke-width="5" stroke-linejoin="round" />
    <path d="M152 140 L152 196 Q216 232 280 196 L280 140 L216 168 Z" fill="#123f7d" opacity="0.95" />
    <path d="M285 112 C322 128 330 164 316 196" fill="none" stroke="#f7b731" stroke-width="10" stroke-linecap="round" />
    <path d="M316 196 v26" stroke="#f7b731" stroke-width="10" stroke-linecap="round" />
    <circle cx="316" cy="230" r="12" fill="#f7b731" />
  </g>

  <!-- 高光点缀 -->
  <circle cx="106" cy="226" r="7" fill="#dbeafe" opacity="0.85" />
  <circle cx="430" cy="206" r="6" fill="#bfdbfe" opacity="0.8" />
</svg>
